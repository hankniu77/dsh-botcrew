name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node scripts/check-syntax.mjs
      - name: Platform smoke
        run: node scripts/platform-smoke.mjs
      - name: macOS integration smoke
        if: runner.os == 'macOS'
        run: node scripts/mac-smoke.mjs
      - name: Package dry run
        run: npm pack --dry-run
