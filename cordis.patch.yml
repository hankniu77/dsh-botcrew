- insert:
    - id: botcrew
      name: 'dsh-botcrew'
    - id: botcrew-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: office
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js (process.env.DSH_PROFILE_DIR || process.cwd()) + '/node_modules/dsh-botcrew/src/mcp-server.js'
        cwd: !!js process.env.DSH_PROFILE_DIR || process.cwd()
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: true

